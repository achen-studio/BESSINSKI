[build]
  command = "NITRO_PRESET=netlify npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Static files only. Nitro does not set Cache-Control on these, and this
# path is more specific than Netlify's default max-age=0.
[[headers]]
  for = "/bess/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# These woff2 URLs are the permanent files. A new cut of a face needs a new
# filename, because immutable tells the browser not to revalidate for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
